<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fafaf6">
  <title>図書館受付｜2日間サマリー</title>
  <link rel="stylesheet" href="summary.css">
  <script type="module" src="src/summary-page.js"></script>
</head>
<body>
<main class="summary-sheet">
  <header>
    <img src="assets/cutouts/ART-01_yaezakura.png" alt="" width="36" height="36">
    <div class="heading"><h1>図書館受付 2日間サマリー</h1><p>2026年10月31日・11月1日</p><p id="report-status" role="status">記録を読み込んでいます…</p></div>
    <nav aria-label="サマリーの操作"><a href="./">受付画面へ戻る</a><button id="print-summary" disabled>印刷</button></nav>
  </header>
  <section class="totals" aria-label="2日間合計">
    <article class="entry"><h2>入場者数・2日間合計</h2><p><strong id="report-entry-value">—</strong><span>人</span></p></article>
    <article class="akarenga"><h2>赤煉瓦・2日間合計</h2><p><strong id="report-akarenga-value">—</strong><span>冊</span></p></article>
  </section>
  <section class="daily"><h2>日別の結果</h2><table><thead><tr><th>日付</th><th>入場者数</th><th>赤煉瓦</th><th>状態</th></tr></thead><tbody id="report-days"></tbody></table></section>
  <section class="graphs" aria-label="時間帯別の2日間通算">
    <article class="entry"><h2>入場者数の推移</h2><p class="graph-note">2日間合算・30分ごと</p><div class="plot"><div id="entry-axis" class="axis" aria-hidden="true"></div><div class="grid" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div id="entry-bars" class="bars" role="img" aria-label="入場者数の時間帯別推移"></div></div><div class="time-labels"><span>9:00</span><span>11:00</span><span>13:00</span><span>15:00</span><span>16:30</span></div></article>
    <article class="akarenga"><h2>赤煉瓦の推移</h2><p class="graph-note">2日間合算・30分ごと</p><div class="plot"><div id="akarenga-axis" class="axis" aria-hidden="true"></div><div class="grid" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div id="akarenga-bars" class="bars" role="img" aria-label="赤煉瓦の時間帯別推移"></div></div><div class="time-labels"><span>9:00</span><span>11:00</span><span>13:00</span><span>15:00</span><span>16:30</span></div></article>
  </section>
  <footer><p id="report-outside"></p><p>合計は終日分。このブラウザに保存した記録を表示しています。<span id="report-updated"></span></p></footer>
</main>
</body>
</html>
